      <stop offset="0" stop-color="#2F7380" />
      <stop offset="0.45" stop-color="#2F7380" />
      <stop offset="1" stop-color="#B84E50" />
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M12 2.6c2.8 2.1 6 3.1 10 3.1v4.8c0 5.4-4.1 8.9-10 10.9C6.1 19.4 2 15.9 2 10.5V5.7c4 0 7.2-1 10-3.1z" fill="url(#shield-check-icon-gradient)" />
  <!-- Check -->
  <path d="m7.8 11.5 3.4 3.4 5.6-6" stroke="#fff" stroke-width="2.4" />
