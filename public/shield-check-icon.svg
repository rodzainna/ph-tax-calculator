<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#shield-check-icon-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Teal for the first part, then into coral: blending straight from teal to coral looks grey at icon size. -->
