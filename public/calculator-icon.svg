<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#calculator-icon-stroke)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Teal for the first part, then into coral: blending straight from teal to coral looks grey at icon size. -->
    <linearGradient id="calculator-icon-stroke" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22">
      <stop offset="0" stop-color="#2F7380" />
      <stop offset="0.45" stop-color="#2F7380" />
      <stop offset="1" stop-color="#B84E50" />
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="3" y="3" width="18" height="18" rx="2.6" />
  <!-- Display -->
  <rect x="4.875" y="4.875" width="14.25" height="3.5625" rx="1.125" fill="#2F7380" stroke="none" />
  <!-- Six keys -->
  <g fill="#9DBBA7" stroke="none">
    <rect x="4.875" y="9.9375" width="3.75" height="2.4375" rx="0.94" />
    <rect x="9.75" y="9.9375" width="3.75" height="2.4375" rx="0.94" />
    <rect x="4.875" y="13.3125" width="3.75" height="2.4375" rx="0.94" />
    <rect x="9.75" y="13.3125" width="3.75" height="2.4375" rx="0.94" />
    <rect x="4.875" y="16.6875" width="3.75" height="2.4375" rx="0.94" />
    <rect x="9.75" y="16.6875" width="3.75" height="2.4375" rx="0.94" />
  </g>
  <!-- Tall key -->
  <rect x="14.625" y="9.9375" width="4.5" height="9.1875" rx="0.94" fill="#CE6A6B" stroke="none" />
</svg>
