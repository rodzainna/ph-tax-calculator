name: CI

# Vercel deploys on its own: a preview for each pull request, and the live site for each change to main.
on:
  push:
  pull_request:

permissions:
  contents: read

# On a branch, a newer push cancels the older run. On main each commit has its own group: in a shared group, GitHub
# drops a waiting run when a newer one arrives, so that commit would never be checked.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    # Both runs happen on purpose: a push checks the branch as it is, and a pull request checks it merged with main.
    # Neither is skipped with `if`, because GitHub counts a skipped job as passed, even for a required check.
    # The rules for main require `Checks (pull_request)` by this name. Renaming it would block every merge.
    name: Checks (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, so that a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      # The build also checks the types.
      - run: pnpm build
